<svg fill="none" viewBox="0 0 900 240" width="100%" height="240" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0d1b2a 100%);
          height: 240px;
          border-radius: 16px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          position: relative;
          overflow: hidden;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          border: 1px solid rgba(56, 139, 253, 0.25);
          box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .glow {
          position: absolute;
          width: 420px;
          height: 180px;
          background: radial-gradient(circle, rgba(56, 189, 248, 0.18) 0%, rgba(139, 92, 246, 0.1) 60%, transparent 80%);
          top: 30px;
          animation: pulse 5s ease-in-out infinite alternate;
        }
        .particles {
          position: absolute;
          inset: 0;
          background-image: radial-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px);
          background-size: 24px 24px;
          opacity: 0.6;
        }
        .title {
          font-size: 32px;
          font-weight: 800;
          color: #ffffff;
          letter-spacing: -0.5px;
          margin: 0 0 10px 0;
          display: flex;
          align-items: center;
          gap: 12px;
          z-index: 10;
          text-shadow: 0 2px 10px rgba(0,0,0,0.6);
        }
        .accent {
          background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          animation: shine 4s ease-in-out infinite alternate;
        }
        .subtitle {
          font-size: 14px;
          font-weight: 400;
          color: #94a3b8;
          text-align: center;
          max-width: 720px;
          line-height: 1.5;
          margin: 0 0 16px 0;
          z-index: 10;
        }
        .tags {
          display: flex;
          gap: 10px;
          z-index: 10;
          flex-wrap: wrap;
          justify-content: center;
        }
        .tag {
          font-size: 11px;
          font-weight: 600;
          color: #38bdf8;
          background: rgba(56, 189, 248, 0.12);
          border: 1px solid rgba(56, 189, 248, 0.3);
          border-radius: 20px;
          padding: 4px 12px;
          text-transform: uppercase;
          letter-spacing: 0.6px;
        }
        @keyframes pulse {
          0% { transform: scale(0.9) translateY(0); opacity: 0.6; }
          100% { transform: scale(1.15) translateY(-8px); opacity: 1; }
        }
        @keyframes shine {
          0% { filter: hue-rotate(0deg); }
          100% { filter: hue-rotate(30deg); }
        }
      </style>
      <div class="container">
        <div class="glow"></div>
        <div class="particles"></div>
        <h1 class="title">
          <span>⚖️</span>
          <span class="accent">Awesome Court Case Management</span>
        </h1>
        <p class="subtitle">
          Curated Hub of Judicial Software, Court CMS Platforms, Dockets, E-Filing &amp; Open-Source Justice Tech
        </p>
        <div class="tags">
          <span class="tag">🏛️ Court CMS</span>
          <span class="tag">📜 E-Filing &amp; Dockets</span>
          <span class="tag">⚖️ Judicial Workflows</span>
          <span class="tag">⚡ Open Source &amp; SaaS</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
